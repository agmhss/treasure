<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Palace Treasure Hunt</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#1b1745;--bg1:#e6efff;--bg2:#fff0c9;--card:#fff;--ln:#c9a13b;--gold:#f2b134;--teal:#0f8b8d;--ok:#1b9c55;--no:#d83a4a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#fdf3d8;--bg1:#14123a;--bg2:#2b1d4f;--card:#241f57;--ln:#e0b64e}}
:root[data-theme=dark]{--ink:#fdf3d8;--bg1:#14123a;--bg2:#2b1d4f;--card:#241f57;--ln:#e0b64e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
.w{max-width:640px;margin:0 auto;padding:14px}
h1,h2{margin:6px 0;text-align:center}h1{font-size:clamp(1.7rem,6vw,2.5rem)}h2{font-size:clamp(1.3rem,4.5vw,1.8rem)}
.card{background:var(--card);border:3px solid var(--ln);border-radius:22px;padding:18px;text-align:center;box-shadow:0 8px 0 #0002}
.gate{position:relative;width:min(70vw,260px);height:300px;margin:12px auto;border-radius:130px 130px 0 0;border:6px solid var(--ln);overflow:hidden;background:linear-gradient(#ffcf6b,#f08a3c)}
.gate i{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#6b3a14 0 14px,#7d4719 14px 28px);border:3px solid var(--ln);transition:transform 1.4s ease}
.gate i:first-child{left:0}.gate i:last-child{right:0}.gate.open i:first-child{transform:translateX(-100%)}.gate.open i:last-child{transform:translateX(100%)}
.gate b{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem}
.btn{font:inherit;font-weight:bold;font-size:1.25rem;padding:12px 28px;margin:10px 4px;border:0;border-radius:40px;color:#1b1745;background:linear-gradient(var(--gold),#e08f12);box-shadow:0 6px 0 #8a5a08;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5a08}.btn.s{background:var(--teal);color:#fff;box-shadow:0 6px 0 #095a5b}
.bar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px;font-weight:bold}
.dr{display:flex;gap:4px;justify-content:center;font-size:1.4rem;margin-bottom:8px}.dr span{opacity:.45}.dr .on{opacity:1;transform:scale(1.25)}
.big{font-size:clamp(2rem,9vw,3.2rem);margin:12px 0;font-weight:bold}
input[type=number],input[type=text]{font:inherit;font-size:1.5rem;width:min(80%,260px);text-align:center;padding:8px;border:3px solid var(--ln);border-radius:14px;background:var(--card);color:var(--ink)}
.o{display:block;width:100%;font:inherit;font-size:1.15rem;text-align:left;color:var(--ink);background:var(--card);border:3px solid var(--ln);border-radius:14px;padding:12px 14px;margin:9px 0;cursor:pointer;touch-action:manipulation}
.o.ok{background:var(--ok);color:#fff}.o.no{background:var(--no);color:#fff;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.wide{width:100%!important;font-size:1.15rem!important;margin:6px 0;text-align:left!important}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}select{font:inherit;font-size:1.15rem;padding:8px;border:3px solid var(--ln);border-radius:14px;background:var(--card);color:var(--ink);margin:6px 0;width:100%}.hf>div:nth-child(2){min-width:0;overflow-wrap:anywhere}.note{background:#c9a13b2a;border-radius:14px;padding:10px 12px;margin:10px 0;text-align:left;line-height:1.5}
.fb{margin-top:8px;font-size:1.1rem}.hf{display:flex;align-items:center;gap:10px;text-align:left;padding:8px;margin:8px 0;border:2px solid var(--ln);border-radius:16px;background:var(--card)}
.hf .av{width:46px;height:46px;border-radius:50%;border:3px solid var(--gold);flex:none;display:grid;place-items:center;font-size:1.4rem;font-weight:bold}
.hf .pc{margin-left:auto;font-size:1.4rem;font-weight:bold}.hf small{display:block;opacity:.75}
.rain{position:fixed;top:-40px;font-size:2rem;animation:fall 3.5s linear forwards;pointer-events:none;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.gate i{transition:none}.rain{display:none}}
</style></head><body><div class="w"><div id="app"></div></div>
<script>
const $=id=>document.getElementById(id),A=$('app');
const R=[
{n:'Hall of Stars',e:'🌌',m:'Aryabhata',c:'Over 1,500 years ago, the scholar Aryabhata wrote the Aryabhatiya. India’s first satellite, launched in 1975, was named after him!',q:'Who first explained that the Earth spins on its axis, giving us day and night?',o:['Aryabhata','Ptolemy','Aristotle'],a:0,l:'Aryabhata explained the spinning Earth in the 5th century.'},
{n:'Hall of Numbers',e:'🔢',m:'Srinivasa Ramanujan',c:'A self-taught genius born in Erode, Tamil Nadu, Ramanujan filled notebooks with amazing formulas. His birthday, 22 December, is National Mathematics Day.',q:'The number 1729 is famously linked to which mathematician?',o:['Ramanujan','Euclid','Pythagoras'],a:0,l:'1729 is the smallest number that is a sum of two cubes in two different ways.'},
{n:'Hall of Healing',e:'🩺',m:'Sushruta',c:'More than 2,000 years ago, Sushruta wrote the Sushruta Samhita, describing surgery, bone-setting and even repairing noses.',q:'Who is called the Father of Surgery in ancient India?',o:['Sushruta','Aryabhata','Kalidasa'],a:0,l:'Sushruta described over 100 surgical tools!'},
{n:'Hall of Words',e:'📜',m:'Panini',c:'Panini wrote the Ashtadhyayi, a Sanskrit grammar with nearly 4,000 short rules. It is so precise that people compare it to computer programming.',q:'Who wrote the Sanskrit grammar book Ashtadhyayi?',o:['Kalidasa','Panini','Valmiki'],a:1,l:'Panini’s rules shaped how Sanskrit is studied even today.'},
{n:'Hall of Light',e:'💡',m:'C. V. Raman',c:'In 1928, C. V. Raman discovered how light changes as it passes through a transparent material. He won the Nobel Prize in Physics in 1930.',q:'National Science Day (28 February) celebrates which discovery?',o:['Law of Gravity','Electricity','Raman Effect'],a:2,l:'28 February 1928 is when the Raman Effect was announced.'},
{n:'Hall of Plants',e:'🌿',m:'J. C. Bose',c:'Jagadish Chandra Bose showed that plants respond to touch, light and sound. He also did pioneering work on radio waves.',q:'Which instrument did J. C. Bose invent to measure tiny plant growth?',o:['Telescope','Stethoscope','Crescograph'],a:2,l:'The Crescograph could magnify plant growth by thousands of times.'},
{n:'Hall of Rockets',e:'🚀',m:'A. P. J. Abdul Kalam',c:'Born in Rameswaram, Dr Kalam helped build India’s rockets and missiles, became our 11th President and is called the Missile Man.',q:'Which famous book is Dr Kalam’s autobiography?',o:['Gitanjali','Wings of Fire','Discovery of India'],a:1,l:'Wings of Fire inspires millions of young readers.'},
{n:'Hall of Space',e:'🛰️',m:'Vikram Sarabhai',c:'Vikram Sarabhai helped set up India’s space programme and started the first rocket launches from Thumba in Kerala.',q:'Who is called the Father of the Indian Space Programme?',o:['Homi Bhabha','C. V. Raman','Vikram Sarabhai'],a:2,l:'ISRO grew from the dream of Vikram Sarabhai.'}];
const x=(a,b)=>a+Math.random()*(b-a+1)|0;
function gen(l){let a,b,c;switch(l){
case 0:a=x(12,49);b=x(12,49);return[a+' + '+b,a+b];
case 1:a=x(50,99);b=x(11,49);return[a+' − '+b,a-b];
case 2:a=x(12,35);b=x(3,9);return[a+' × '+b,a*b];
case 3:a=x(21,99);b=x(21,99);c=x(21,99);return[a+' + '+b+' + '+c,a+b+c];
case 4:a=x(11,25);b=x(11,19);return[a+' × '+b,a*b];
case 5:b=x(4,9);a=b*x(12,40);return[a+' ÷ '+b,a/b];
case 6:a=x(12,30);b=x(5,9);c=x(10,50);return[a+' × '+b+' − '+c,a*b-c];
default:a=x(12,40);b=x(12,40);c=x(3,9);return['('+a+' + '+b+') × '+c,(a+b)*c]}}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sh=a=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const API='';/* paste your Apps Script web app URL between the quotes */
let r,t0,wrong,cur,tick,mem=[];
function load(){try{return JSON.parse(localStorage.getItem('palace_hof')||'[]')}catch(e){return mem}}
function store(h){mem=h;try{localStorage.setItem('palace_hof',JSON.stringify(h))}catch(e){}}
function me(){try{return JSON.parse(localStorage.getItem('palace_me')||'{}')}catch(e){return{}}}
function home(){clearInterval(tick);A.innerHTML=`<h1>🏰 Palace Treasure Hunt</h1><div class="gate" id="g"><i></i><i></i><b>👑</b></div><div class="card"><p>Open the gate and explore 8 halls. In each hall, <b>solve a sum</b> to unlock a clue about a great Indian mind, then <b>answer a question</b>. Finish quickly to win the Treasure Trove!</p><button class="btn" onclick="start()">Open the Gate</button><button class="btn s" onclick="hall()">Hall of Fame</button></div>`}
function start(){$('g').classList.add('open');setTimeout(()=>{r=0;wrong=0;t0=Date.now();tick=setInterval(()=>{const e=$('tm');if(e)e.textContent=fmt((Date.now()-t0)/1000)},500);math()},1300)}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function hdr(){return `<div class="dr">${R.map((_,i)=>`<span class="${i<r?'':i==r?'on':''}">${i<r?'✅':i==r?'🔓':'🚪'}</span>`).join('')}</div><div class="bar"><span>Hall ${r+1} of 8</span><span>⏱ <span id="tm">${fmt((Date.now()-t0)/1000)}</span></span><span>❌ ${wrong}</span></div>`}
function math(){cur=gen(r);const h=R[r];A.innerHTML=hdr()+`<div class="card"><h2>${h.e} ${h.n}</h2><p>🔒 This door is locked. Solve the sum to open it!</p><div class="big">${cur[0]} = ?</div><input id="in" type="number" inputmode="numeric" autofocus><br><button class="btn" onclick="chk()">Unlock</button><div class="fb" id="fb"></div></div>`;$('in').addEventListener('keydown',e=>{if(e.key=='Enter')chk()})}
function chk(){const v=$('in').value;if(v==='')return;if(+v===cur[1]){quiz()}else{wrong++;$('fb').textContent='❌ Not quite. Try again!';$('in').value='';$('in').focus()}}
function quiz(){const h=R[r],op=sh(h.o.map((t,i)=>({t,ok:i==h.a})));A.innerHTML=hdr()+`<div class="card"><h2>${h.e} ${h.n}</h2><div class="note">🗝️ <b>Clue: ${h.m}</b><br>${h.c}</div><p><b>${h.q}</b></p>${op.map(o=>`<button class="o" data-ok="${o.ok?1:0}" onclick="pick(this)">${esc(o.t)}</button>`).join('')}<div class="fb" id="fb"></div></div>`}
function pick(b){if(b.dataset.ok=='1'){document.querySelectorAll('.o').forEach(o=>o.disabled=true);b.classList.add('ok');$('fb').innerHTML=`✅ <b>Correct!</b> ${R[r].l}<br><button class="btn" onclick="next()">${r==7?'Open the Treasure Trove 💎':'Next hall ▶'}</button>`}else{wrong++;b.classList.add('no');b.disabled=true;$('fb').textContent='❌ Try another answer.'}}
function next(){r++;r>=8?end():math()}
function end(){clearInterval(tick);const t=(Date.now()-t0)/1000;const pct=Math.max(5,Math.min(100,Math.round(48000/t))-2*wrong);cur={t,pct};
for(let i=0;i<30;i++){const e=document.createElement('div');e.className='rain';e.textContent=['💎','⭐','👑','🎉'][i%4];e.style.left=Math.random()*95+'vw';e.style.animationDelay=Math.random()*2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),6000)}
A.innerHTML=`<h1>💎 Treasure Trove!</h1><div class="card"><div class="big">${pct}%</div><p>Time ${fmt(t)} · Wrong tries ${wrong}</p><p>Your speed score is based on how fast you finished, minus 2 for each wrong try.</p><p><b>Join the Hall of Fame</b></p><input id="nm" class="wide" type="text" maxlength="40" placeholder="Your name" value="${esc(me().n||'')}"><input id="sc" class="wide" type="text" maxlength="60" placeholder="Your school" value="${esc(me().sc||'')}"><div class="row"><select id="cl" aria-label="Class">${[6,7,8,9].map(c=>`<option value="${c}" ${me().c==c?'selected':''}>Class ${c}</option>`).join('')}</select><input id="se" class="wide" type="text" maxlength="3" placeholder="Section" value="${esc(me().s||'')}"></div><button class="btn" onclick="save()">Save to Hall of Fame</button></div>`}
async function save(){const g=k=>$(k).value.trim();const n=g('nm'),sc=g('sc'),se=g('se').toUpperCase();
if(!n){$('nm').focus();$('nm').placeholder='Please type your name';return}
if(!sc){$('sc').focus();$('sc').placeholder='Please type your school';return}
const e={n,sc,c:+$('cl').value,s:se,pct:cur.pct,t:Math.round(cur.t),d:Date.now()};
try{localStorage.setItem('palace_me',JSON.stringify({n,sc,c:e.c,s:se}))}catch(x){}
if(API){try{await fetch(API,{method:'POST',body:JSON.stringify(e)})}catch(x){}}else{const h=load();h.push(e);h.sort((a,b)=>b.pct-a.pct||a.t-b.t);store(h.slice(0,20))}
hall(e.d)}
async function hall(id){A.innerHTML='<h1>🏆 Hall of Fame</h1><div class="card">Loading heroes…</div>';let h;
if(API){try{h=await (await fetch(API)).json()}catch(x){h=null}}else h=load();
const m=['🥇','🥈','🥉'];if(!h){A.innerHTML='<h1>🏆 Hall of Fame</h1><div class="card">Could not load the Hall of Fame. Check the internet and try again.</div><div style="text-align:center"><button class="btn" onclick="home()">Back</button></div>';return}
A.innerHTML=`<h1>🏆 Hall of Fame</h1>`+(h.length?h.map((e,i)=>`<div class="hf" ${e.d===id?'style="background:#f2b13433"':''}><div class="av">${m[i]||i+1}</div><div><b>${esc(e.n)}</b><small>${esc(e.sc)}</small><small>Class ${esc(e.c)}${e.s?' '+esc(e.s):''} · ${fmt(e.t)}</small></div><div class="pc">${e.pct}%</div></div>`).join(''):'<div class="card">No heroes yet. Be the first to find the treasure!</div>')+`<div style="text-align:center"><button class="btn" onclick="home()">Play again</button></div>`}
home();
</script></body></html>
